<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're Offline — ZomatoClone</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif; background: #f8f9fa; color: #2b2b2b;
            display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0;
        }
        .box { text-align: center; padding: 24px; }
        .box div.icon { font-size: 64px; margin-bottom: 12px; }
        h2 { margin-bottom: 6px; }
        p { color: #888; font-size: 14px; }
        button {
            margin-top: 20px; padding: 10px 28px; background: #e8342a; color: white;
            border: none; border-radius: 50px; font-weight: 600; cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon">📡</div>
        <h2>You're offline</h2>
        <p>Check your internet connection and try again.</p>
        <button onclick="window.location.reload()">Retry</button>
    </div>
</body>
</html>
